<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Bootstrap Grid và Flexbox</title>
    <!-- Nhúng CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bước 5: Nhúng Font Awesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Tiêu đề & Sử dụng Font Awesome -->
    <header class="container mt-4 text-center">
        <h2><i class="fas fa-home text-primary"></i> Trang thực hành Bootstrap Grid & Flexbox</h2>
    </header>

    <!-- Bước 1: Cấu trúc Grid với 3 cột và căn giữa nội dung bằng Flexbox -->
    <section class="container mt-5">
        <div class="row">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border">
                <p class="m-0 fw-bold">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white border">
                <p class="m-0 fw-bold">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border">
                <p class="m-0 fw-bold">Phần 3</p>
            </div>
        </div>
    </section>

    <!-- Bước 2: Áp dụng Margin & Padding để điều chỉnh khoảng cách -->
    <section class="container my-5 py-3 bg-light rounded text-center">
        <h3>Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </section>

    <!-- Bước 3: Sử dụng Display Property để ẩn/hiện nội dung (chỉ hiện từ >= 768px) -->
    <div class="container my-4">
        <div class="d-none d-md-block bg-warning text-center p-3 rounded">
            <p class="m-0 fw-bold">Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px (Desktop/Tablet)</p>
        </div>
    </div>

    <!-- Bước 4: Tạo Carousel (Slideshow) -->
    <section class="container">
        <div id="myCarousel" class="carousel slide mt-5" data-bs-ride="carousel">
            <div class="carousel-inner rounded shadow">
                <div class="carousel-item active">
                    <img src="https://via.placeholder.com/1200x400/007bff/ffffff?text=H%C3%ACnh+%E1%BA%A3nh+1" class="d-block w-100" alt="Hình ảnh 1">
                </div>
                <div class="carousel-item">
                    <img src="https://via.placeholder.com/1200x400/28a745/ffffff?text=H%C3%ACnh+%E1%BA%A3nh+2" class="d-block w-100" alt="Hình ảnh 2">
                </div>
                <div class="carousel-item">
                    <img src="https://via.placeholder.com/1200x400/dc3545/ffffff?text=H%C3%ACnh+%E1%BA%A3nh+3" class="d-block w-100" alt="Hình ảnh 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>
    </section>

    <!-- Bước 6: Tạo Form liên hệ -->
    <section class="container mt-5 mb-5">
        <div class="card p-4 shadow-sm" style="max-width: 600px; margin: 0 auto;">
            <h4 class="card-title text-center mb-4">Biểu mẫu liên hệ</h4>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Họ và tên</label>
                    <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label fw-bold">Nội dung</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="fas fa-paper-plane me-1"></i> Gửi
                </button>
            </form>
        </div>
    </section>

    <!-- JS Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
