<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành grid-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Ví dụ 1: Thiết lập khoảng cách giữa hàng và cột giống nhau (20px)</h2>
    <div class="grid-container ex1">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
    </div>

    <hr>

    <h2>Ví dụ 2: Thiết lập khoảng cách hàng (30px) và cột (10px) khác nhau</h2>
    <div class="grid-container ex2">
        <div>Ô 1</div>
        <div>Ô 2</div>
        <div>Ô 3</div>
        <div>Ô 4</div>
        <div>Ô 5</div>
        <div>Ô 6</div>
    </div>

</body>
</html>
