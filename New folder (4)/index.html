<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký - Bootstrap Forms</title>
    <!-- Nhúng CSS Bootstrap 5 CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tiêu đề trang -->
                        <h2 class="text-center fw-bold mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-muted text-center mb-4">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản.</p>

                        <form>
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label fw-semibold">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên của bạn" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Địa chỉ Email</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không bao giờ chia sẻ email của bạn với bất kỳ ai khác.</div>
                            </div>

                            <!-- 3. Mật khẩu -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                            </div>

                            <!-- 4. Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <!-- 5. Giới tính (Radio buttons) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" checked>
                                    <label class="form-check-label" for="male">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                                    <label class="form-check-label" for="female">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="other" value="other">
                                    <label class="form-check-label" for="other">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkboxes) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="sports" value="sports">
                                    <label class="form-check-label" for="sports">Thể thao</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="music" value="music">
                                    <label class="form-check-label" for="music">Âm nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="travel" value="travel">
                                    <label class="form-check-label" for="travel">Du lịch</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label fw-semibold">Quốc gia</label>
                                <select class="form-select" id="country" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ (United States)</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                </select>
                            </div>

                            <!-- 8. Nút Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng Ký</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
